[package]
name = "apns-h2"
version = "0.10.0"
license = "MIT"
readme  = "README.md"
description = "Async HTTP/2 APNs client based on hyper"
keywords    = ["apns", "apple", "push", "async", "http2"]
repository  = "https://github.com/threema-ch/apns-h2.git"
homepage    = "https://threema.ch/"
documentation = "https://docs.rs/apns-h2"
edition = "2024"
rust-version = "1.85"  # set the minimum rust version we can work with.

[features]
default = ["openssl"]
tracing = ["dep:tracing"]
ring = ["dep:ring"]

[dependencies]
serde = { version = "1", features = ["derive"] }
erased-serde = "0.3"
serde_json = "1"
thiserror = "1"
openssl = { version = "0.10", optional = true }
hyper = { version = "1.0", default-features = false, features = ["client", "http2"] }
hyper-util = { version = "0.1", features = ["client", "http2", "client-legacy", "tokio"] }
http-body-util = "0.1"
http = "1.0"
base64 = "0.21"
tracing = { version = "0.1", optional = true }
ring = { version = "0.17", features = ["std"], optional = true }
hyper-rustls = { version = "0.26.0", default-features = false, features = ["http2", "webpki-roots", "ring"] }
rustls = "0.22.4"
parking_lot = "0.12"
tokio = { version = "1", features = ["time"] }
rustls-pki-types = { version = "1.14.0", features = ["std"]}

[dev-dependencies]
argparse = "0.2"
tracing-subscriber = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
